
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>BEB Administrator Dashboard</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: #0b111b;
    color: #f5f7fb;
    font-family: Arial, Helvetica, sans-serif;
  }

  .wrap {
    width: min(1100px, calc(100% - 36px));
    margin: auto;
  }

  header {
    background: #152033;
    border-bottom: 1px solid #29374b;
    padding: 20px 0;
  }

  .brand-logo {
    width: 280px;
    max-width: 100%;
  }

  main {
    min-height: 75vh;
    padding: 60px 0;
  }

  h1 { font-size: 38px; }

  .panel {
    padding: 28px;
    background: #152033;
    border: 1px solid #29374b;
    border-radius: 12px;
    margin-top: 25px;
  }

  .muted {
    color: #acbbcf;
    line-height: 1.7;
  }

  .hidden { display: none !important; }
</style>
</head>

<body>

<header>
  <div class="wrap">
    <a href="index.html">
      <img
        src="beb-logo.jpg"
        alt="Bavarian Endurance Battle"
        class="brand-logo">
    </a>
  </div>
</header>

<main>
  <div class="wrap">
    <h1>BEB Administrator Dashboard</h1>
    <p class="muted">
      Review and manage team profiles submitted
      for the Bavarian Endurance Battle public paddock.
    </p>

    <section class="panel" id="adminStatus">
      Checking administrator access...
    </section>

    <section class="panel hidden" id="adminPanel">
      <h2>Teams Awaiting Approval</h2>
      <div id="pendingTeams">
        Loading submitted teams...
      </div>
    </section>
  </div>
</main>
<script type="module">
import { createClient } from
  "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SUPABASE_URL =
  "https://hjeovuaecghiigoqcmoa.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_zVPjF4qp5C-T-5vZcyx0_g_sMkJRzMT";

const supabase = createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);
 
async function checkAdminAccess() {
  const status = document.getElementById("adminStatus");
  const panel = document.getElementById("adminPanel");

  const { data: authData, error: authError } =
    await supabase.auth.getUser();

  if (authError || !authData.user) {
    status.textContent =
      "Please sign in to your BEB account to access this page.";
    return;
  }

  const { data: isAdmin, error: adminError } =
    await supabase.rpc("is_beb_admin");

  if (adminError || isAdmin !== true) {
    status.textContent =
      "Access denied. This page is reserved for BEB administrators.";
    return;
  }

  status.textContent = "Administrator access verified.";
  panel.classList.remove("hidden");
 await loadPendingTeams();
}

async function loadPendingTeams() {
  const container = document.getElementById("pendingTeams");

  container.textContent = "Loading submitted teams...";

  const { data: teams, error } = await supabase
    .from("teams")
    .select("id,team_name,hometown,car_year,car_model,racing_class,status")
    .eq("status", "pending")
    .order("created_at", { ascending: true });

  if (error) {
    container.textContent =
      "Could not load submitted teams: " + error.message;
    return;
  }

  container.replaceChildren();

  if (!teams.length) {
    container.textContent = "No teams awaiting approval.";
    return;
  }

  for (const team of teams) {
    const card = document.createElement("div");

    card.style.cssText =
      "padding:20px;margin:15px 0;border:1px solid #29374b;border-radius:8px;";

    const heading = document.createElement("h3");
    heading.textContent = team.team_name;

    const details = document.createElement("p");
    details.className = "muted";
    details.textContent = [
      team.hometown,
      [team.car_year, team.car_model].filter(Boolean).join(" "),
      team.racing_class
    ].filter(Boolean).join(" | ");

    const status = document.createElement("p");
    status.textContent = "Status: " + team.status;
const approveButton = document.createElement("button");
approveButton.type = "button";
approveButton.textContent = "Approve Team";
approveButton.style.marginTop = "15px";
approveButton.addEventListener("click", async () => {
  const confirmed = confirm(
    "Approve " + team.team_name +
    " and publish this team in the BEB Team Paddock?"
  );

  if (!confirmed) return;

  approveButton.disabled = true;
  approveButton.textContent = "Approving...";

  const { data, error } = await supabase
    .from("teams")
    .update({ status: "published" })
    .eq("id", team.id)
    .eq("status", "pending")
    .select("id,status")
    .single();

  if (error) {
    approveButton.disabled = false;
    approveButton.textContent = "Approve Team";
    alert("Approval failed: " + error.message);
    return;
  }

  alert(team.team_name + " has been approved!");
  await loadPendingTeams();
});
card.append(heading, details, status);
card.appendChild(approveButton);
    container.appendChild(card);
  }
}

checkAdminAccess();

</script>
</body>
</html>
